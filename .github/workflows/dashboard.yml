name: Dashboard checks
on:
  push:
    branches: [master, feature/vercel-dashboard]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dashboard.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_dashboard.py --check
      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run typecheck
        working-directory: web
