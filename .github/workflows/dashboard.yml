name: Dashboard checks
on:
  push:
    branches: [master, feature/vercel-dashboard, feature/dashboard-readability]
  pull_request:
    branches: [master, feature/vercel-dashboard]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_dashboard.py --check
      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - name: Browser readability checks
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run start > /tmp/dashboard-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
          node scripts/readability-smoke.mjs
      - name: Retain review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-readability-review
          path: readability-browser-results/
          if-no-files-found: ignore
          retention-days: 7
